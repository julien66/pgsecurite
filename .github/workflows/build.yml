name: Compiler le livre

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compiler la couverture, le PDF, l'EPUB, le HTML et le site avec Pandoc
        run: |
          docker run --rm -e GOATCOUNTER="${{ vars.GOATCOUNTER }}" -v "$PWD:/data" -w /data --entrypoint sh pandoc/extra:3.5 -c '
            set -e
            apk add --no-cache make font-dejavu rsvg-convert python3
            make site GOATCOUNTER="$GOATCOUNTER"'
      - uses: actions/upload-artifact@v4
        with:
          name: livre
          path: |
            build/*
            !build/site
      - name: Préparer le site de lecture
        if: github.ref == 'refs/heads/main' && vars.PUBLIER_SITE == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  # Publication sur GitHub Pages. Désactivée tant que la variable PUBLIER_SITE
  # du dépôt ne vaut pas "true" (voir le README, section « Site de lecture »).
  site:
    needs: build
    if: github.ref == 'refs/heads/main' && vars.PUBLIER_SITE == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
