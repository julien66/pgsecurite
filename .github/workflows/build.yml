name: Compiler le livre

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compiler PDF, EPUB et HTML avec Pandoc
        run: |
          docker run --rm -v "$PWD:/data" -w /data --entrypoint sh pandoc/extra:3.5 \
            -c "apk add --no-cache make font-dejavu && make all"
      - uses: actions/upload-artifact@v4
        with:
          name: livre
          path: build/
